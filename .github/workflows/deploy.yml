name: SCREENROOM CI and production deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: screenroom-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: screenroom-server/package-lock.json
      - name: Install backend dependencies
        working-directory: screenroom-server
        run: npm ci --no-audit --no-fund
      - name: Backend tests
        working-directory: screenroom-server
        run: npm test
      - name: Syntax and FTPS manifest checks
        run: |
          node --check screenroom-server/app.js
          node --check screenroom-server/server.js
          node --check screenroom-server/studio/studio.js
          node --check watch/assets/screenroom.js
          python -m py_compile scripts/deploy_ftps.py
          python scripts/deploy_ftps.py --mode screenroom-web --dry-run
          python scripts/deploy_ftps.py --mode screenroom-api --dry-run
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Upload isolated subdomain static frontend
        run: python scripts/deploy_ftps.py --mode screenroom-web
        env:
          FTPS_HOST: nova.hostseba.com
          FTPS_USERNAME: ${{ secrets.WEB_FTPS_USERNAME }}
          FTPS_PASSWORD: ${{ secrets.WEB_FTPS_PASSWORD }}
      - name: Upload cPanel Node app, preserving .env and dependencies
        run: python scripts/deploy_ftps.py --mode screenroom-api
        env:
          FTPS_HOST: nova.hostseba.com
          FTPS_USERNAME: ${{ secrets.API_FTPS_USERNAME }}
          FTPS_PASSWORD: ${{ secrets.API_FTPS_PASSWORD }}
      - name: Confirm frontend and API are reachable
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          # Some hosting firewalls close connections from GitHub-hosted runners.
          # FTP read-back checks above are mandatory; network-only errors are warnings.
          targets = [('https://screenroom.devrijonn.com/', 'html'), ('https://screenroom.devrijonn.com/screenroom-api/health', 'json')]
          for url, kind in targets:
              for attempt in range(3):
                  try:
                      request = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (compatible; ScreenroomDeployHealth/1.0)'})
                      with urllib.request.urlopen(request, timeout=15) as response:
                          if response.status != 200:
                              raise SystemExit(f'Health check HTTP {response.status}: {url}')
                          body = response.read(8192)
                          if kind == 'html' and b'<html' not in body.lower():
                              raise SystemExit(f'Unexpected HTML response: {url}')
                          if kind == 'json' and json.loads(body).get('ok') is not True:
                              raise SystemExit(f'Unhealthy JSON response: {url}')
                          print(f'Live health check passed: {url}')
                      break
                  except urllib.error.HTTPError as exc:
                      raise SystemExit(f'Health check HTTP {exc.code}: {url}')
                  except (urllib.error.URLError, OSError) as exc:
                      if attempt < 2:
                          time.sleep(3)
                          continue
                      print(f'::warning::GitHub runner cannot reach {url} ({type(exc).__name__}); remote files verified via FTPS checksum. Check site from an independent network.')
          PY
